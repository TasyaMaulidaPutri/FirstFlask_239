<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Nama</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <div class="container">
        <h2>Input Nama</h2>

        
        <label for="username">Nama:</label><br>

        <form method="POST" action="/index">

            <br><br>

            <button type="submit">Kirim</button>
        </form>
    </div>

</body>
</html>
